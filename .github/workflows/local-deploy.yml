name: Local Kind Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: local-kind-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to persistent Kind cluster
    runs-on:
      - self-hosted
      - macOS
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      KIND_CLUSTER_NAME: leadflow
      KUBERNETES_CONTEXT: kind-leadflow
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_kube_context: kind-leadflow
      TF_VAR_app_version: ${{ github.sha }}
      TF_VAR_backend_image_tag: ${{ github.sha }}
      TF_VAR_migration_image_tag: ${{ github.sha }}
      TF_VAR_frontend_image_tag: ${{ github.sha }}
      TF_VAR_postgres_user: ${{ secrets.LEADFLOW_POSTGRES_USER }}
      TF_VAR_postgres_password: ${{ secrets.LEADFLOW_POSTGRES_PASSWORD }}
      TF_VAR_database_url: ${{ secrets.LEADFLOW_DATABASE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify deployment tools and Docker Desktop
        run: |
          for tool in docker kind kubectl tofu curl; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::Required tool '$tool' is missing from the runner PATH."
              exit 1
            fi
          done

          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker Desktop is unavailable. Start it for the self-hosted runner user."
            exit 1
          fi

      - name: Validate deployment credentials
        run: |
          if [[ -z "${TF_VAR_postgres_user:-}" ||
                -z "${TF_VAR_postgres_password:-}" ||
                -z "${TF_VAR_database_url:-}" ]]; then
            echo "::error::Set LEADFLOW_POSTGRES_USER, LEADFLOW_POSTGRES_PASSWORD, and LEADFLOW_DATABASE_URL repository secrets."
            exit 1
          fi

      - name: Reuse or bootstrap Kind cluster
        run: |
          if kind get clusters | grep -Fxq "$KIND_CLUSTER_NAME"; then
            echo "Kind cluster found. Reusing existing cluster."
          else
            echo "Kind cluster not found. Creating local development cluster..."
            if bash scripts/create-kind.sh; then
              echo "Kind cluster bootstrap completed."
            elif kind get clusters | grep -Fxq "$KIND_CLUSTER_NAME"; then
              echo "::warning::Cluster creation started but the bootstrap script returned an error. Continuing with readiness and ingress checks."
            else
              echo "::error::Kind cluster bootstrap failed and the cluster is still absent."
              exit 1
            fi
          fi

      - name: Wait for Kind cluster and verify context
        run: |
          echo "Refreshing kubeconfig for Kind cluster '$KIND_CLUSTER_NAME'..."
          kind export kubeconfig --name "$KIND_CLUSTER_NAME"
          echo "Selecting Kubernetes context '$KUBERNETES_CONTEXT'..."
          kubectl config use-context "$KUBERNETES_CONTEXT"
          current_context="$(kubectl config current-context)"
          if [[ "$current_context" != "$KUBERNETES_CONTEXT" ]]; then
            echo "::error::Expected kubectl context '$KUBERNETES_CONTEXT', got '$current_context'."
            exit 1
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "::error::Docker Desktop became unavailable during cluster bootstrap."
            exit 1
          fi

          echo "Waiting for Kind control-plane nodes to become Ready..."
          nodes="$(kubectl get nodes --context "$KUBERNETES_CONTEXT" -o name)"
          if [[ -z "$nodes" ]]; then
            echo "::error::No nodes are registered in Kind cluster '$KIND_CLUSTER_NAME'."
            exit 1
          fi

          while IFS= read -r node; do
            [[ -z "$node" ]] && continue
            echo "Waiting for $node..."
            kubectl wait \
              --context "$KUBERNETES_CONTEXT" \
              --for=condition=Ready \
              --timeout=180s \
              "$node"
          done <<< "$nodes"

          kubectl cluster-info --context "$KUBERNETES_CONTEXT"
          kubectl get nodes --context "$KUBERNETES_CONTEXT"

      - name: Reuse or install ingress-nginx
        run: |
          if kubectl get deployment ingress-nginx-controller \
            --context "$KUBERNETES_CONTEXT" \
            --namespace ingress-nginx >/dev/null 2>&1 &&
            kubectl get service ingress-nginx-controller \
              --context "$KUBERNETES_CONTEXT" \
              --namespace ingress-nginx >/dev/null 2>&1; then
            echo "Ingress controller found. Reusing existing installation."
          else
            echo "Ingress controller not found. Installing the official Kind manifest..."
            kubectl apply \
              --context "$KUBERNETES_CONTEXT" \
              -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          fi

          echo "Waiting for ingress-nginx controller to become Ready..."
          kubectl wait \
            --context "$KUBERNETES_CONTEXT" \
            --namespace ingress-nginx \
            --for=condition=Ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Initialize OpenTofu
        working-directory: terraform/environments/local
        run: tofu init

      - name: Validate OpenTofu configuration
        working-directory: terraform/environments/local
        run: tofu validate -no-color

      - name: Build backend and migration images
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag "leadflow-backend:${GITHUB_SHA}" \
            --tag "leadflow-migrate:${GITHUB_SHA}" \
            backend

      - name: Build frontend image
        run: |
          docker build \
            --file frontend/Dockerfile \
            --build-arg API_INTERNAL_URL=http://backend:3000 \
            --tag "leadflow-frontend:${GITHUB_SHA}" \
            frontend

      - name: Load commit images into the existing Kind cluster
        run: |
          kind load docker-image \
            "leadflow-backend:${GITHUB_SHA}" \
            "leadflow-migrate:${GITHUB_SHA}" \
            "leadflow-frontend:${GITHUB_SHA}" \
            --name "$KIND_CLUSTER_NAME"

      - name: Apply application changes with OpenTofu
        working-directory: terraform/environments/local
        run: tofu apply -auto-approve

      - name: Verify workload rollouts and migration
        run: |
          echo "Waiting for PostgreSQL deployment..."
          kubectl rollout status deployment/postgres \
            --context "$KUBERNETES_CONTEXT" \
            --namespace leadflow \
            --timeout=10m
          echo "Waiting for database migration Job..."
          kubectl wait \
            --context "$KUBERNETES_CONTEXT" \
            --namespace leadflow \
            --for=condition=complete \
            job/leadflow-migrate \
            --timeout=10m
          echo "Waiting for backend deployment..."
          kubectl rollout status deployment/backend \
            --context "$KUBERNETES_CONTEXT" \
            --namespace leadflow \
            --timeout=10m
          echo "Waiting for frontend deployment..."
          kubectl rollout status deployment/frontend \
            --context "$KUBERNETES_CONTEXT" \
            --namespace leadflow \
            --timeout=10m

      - name: Verify ingress and service endpoints
        run: |
          kubectl get ingress leadflow \
            --context "$KUBERNETES_CONTEXT" \
            --namespace leadflow
          kubectl get pods,services,endpoints \
            --context "$KUBERNETES_CONTEXT" \
            --namespace leadflow

          for service in postgres backend frontend; do
            endpoints="$(kubectl get endpoints "$service" \
              --context "$KUBERNETES_CONTEXT" \
              --namespace leadflow \
              -o jsonpath='{.subsets[*].addresses[*].ip}')"
            if [[ -z "$endpoints" ]]; then
              echo "::error::Service '$service' has no ready endpoints."
              exit 1
            fi
          done

      - name: Check backend health endpoint
        run: |
          kubectl exec \
            --context "$KUBERNETES_CONTEXT" \
            --namespace leadflow \
            deployment/backend \
            -- node -e 'fetch("http://127.0.0.1:3000/healthz").then((response) => {
              if (!response.ok) throw new Error(`health endpoint returned ${response.status}`);
            }).catch((error) => {
              console.error(error);
              process.exitCode = 1;
            });'

      - name: Wait for application through Ingress on localhost
        run: |
         echo "Waiting for frontend..."

         for i in {1..30}; do
           STATUS=$(curl --noproxy '*' \
           --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            http://localhost/ || true)

         if [ "$STATUS" = "200" ]; then
            echo "Frontend is healthy."
         exit 0
         fi

          echo "Attempt $i: HTTP $STATUS"
         sleep 5
         done

         echo "Frontend never became healthy."
         exit 1

      - name: Collect cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,services,endpoints,ingress \
            --context "$KUBERNETES_CONTEXT" \
            --all-namespaces
          kubectl get events \
            --context "$KUBERNETES_CONTEXT" \
            --namespace leadflow \
            --sort-by=.lastTimestamp
