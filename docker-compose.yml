x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-backend-environment: &backend-environment
  DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-leadflow}"
  PORT: "3000"
  APP_VERSION: "${APP_VERSION:-dev}"
  DB_POOL_MAX: "${DB_POOL_MAX:-10}"

services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-leadflow}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend-database

  migrate:
    build: *backend-build
    command: ["node", "dist/migrate.js"]
    environment: *backend-environment
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
    networks:
      - backend-database

  backend:
    build: *backend-build
    environment: *backend-environment
    expose:
      - "3000"
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/readyz').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend-database
      - frontend-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: "http://backend:3000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend-backend

networks:
  backend-database:
    driver: bridge
  frontend-backend:
    driver: bridge

volumes:
  postgres_data:
